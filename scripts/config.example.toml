# SignalConnector config.toml — created by scripts/setup.ps1.
# Copy to %APPDATA%\SignalConnector\config.toml and edit.
# Paths use TOML literal strings (single quotes) so backslashes are not escapes.

[channel]
kind = "note-to-self"        # "note-to-self" (own number) or "group"
# id = "+1..."               # required only for "group": the group id

[signal]
cliPath = 'C:\Users\you\AppData\Local\SignalConnector\signal-cli\signal-cli-0.14.9\bin\signal-cli.bat'
# Preferred: invoke the jar directly with a wildcard classpath (signal-cli.bat
# overflows the Windows command-line limit on long install paths).
command = ['C:\Program Files\Microsoft\jdk-25.0.4.101-hotspot\bin\java.exe', '--enable-native-access=ALL-UNNAMED', '-cp', 'C:\Users\you\AppData\Local\SignalConnector\signal-cli\signal-cli-0.14.9\lib\*', 'org.asamk.signal.Main']
account = ""                 # the linked number, e.g. "+1..."
manageDaemon = true          # let the service start signal-cli itself
daemonHost = "127.0.0.1"
daemonPort = 8080

[agent]
kind = "opencode-server"     # "opencode-server" or "opencode-cli"
serverUrl = "http://127.0.0.1:4096"
opencodePath = "opencode"

# Hearing the room and talking back in a meeting (optional). Local whisper or
# sherpa transcribes on this machine; "http"/"nvidia" and "azure"/"http"/"edge"
# voices send audio or text to a hosted service when you choose one. The paths
# below are printed by scripts/install-whisper.ps1, which fetches whisper.cpp, a
# multilingual model and the Silero VAD model into %LOCALAPPDATA%\SignalConnector.
# Audio is never kept: one temp WAV per utterance and per spoken clip, deleted
# right after the run.
[voice]
# whisperPath = 'C:\Users\you\AppData\Local\SignalConnector\whisper\whisper-cli.exe'
# modelPath = 'C:\Users\you\AppData\Local\SignalConnector\whisper\models\ggml-small.bin'
# vadPath = 'C:\Users\you\AppData\Local\SignalConnector\whisper\models\ggml-silero-v6.2.0.bin'
# Natural local voice (optional). Both paths set = Piper speaks; empty = the
# Windows system voice is used. Fetched by scripts/install-piper.ps1.
# piperPath = 'C:\Users\you\AppData\Local\SignalConnector\piper\piper\piper.exe'
# piperVoicePath = 'C:\Users\you\AppData\Local\SignalConnector\piper\voices\uk_UA-oleksa-high.onnx'
language = "auto"              # pin the language you speak; "auto" misfires on short clips
# Which recogniser to use: auto (sherpa if configured, else whisper), or force
# whisper | sherpa | http | nvidia. "http" sends each utterance to an
# OpenAI-compatible /v1/audio/transcriptions endpoint; "nvidia" uses NVIDIA's
# hosted whisper-large-v3 over Riva gRPC (grpc.nvcf.nvidia.com, function id
# below). Both hosted choices need the transcription-api-key secret (or
# TRANSCRIPTION_API_KEY in the environment) and send audio off the machine.
transcriber = "auto"
# rivaHost = "grpc.nvcf.nvidia.com:443"
# rivaFunctionId = "b702f636-f60c-4a3d-a6f4-f3568c13bd7d"
# rivaLanguage = "uk-UA"
# httpTranscriptionUrl = 'http://127.0.0.1:8000/v1/audio/transcriptions'
# httpTranscriptionModel = "openai/whisper-large-v3"
# httpTranscriptionLanguage = "uk"
# Names the recogniser should spell as typed, not as it hears them; "" sends none.
# transcriptionPrompt = "SignalConnector, opencode, GitHub, Jitsi, TypeScript, npm"
# Live recognition over the same key's Realtime socket: frames are uploaded while
# you speak, so the final arrives in a few hundred milliseconds. The batch
# recogniser above stays as the fallback. "off" keeps the WAV path only.
# streamingTranscription = "openai"
# streamingTranscriptionModel = "gpt-live-transcribe"
# sherpa-onnx + Ukrainian Moonshine (scripts/install-sherpa.ps1). When both are
# set it replaces whisper: several times faster on short utterances.
# sherpaPath = 'C:\Users\you\AppData\Local\SignalConnector\sherpa\...\bin\sherpa-onnx-offline.exe'
# sherpaModelDir = 'C:\Users\you\AppData\Local\SignalConnector\sherpa\sherpa-onnx-moonshine-base-uk-quantized-2026-02-27'
# Said once when the avatar has joined and is listening. Set to "" to stay quiet.
greeting = "Привіт, я під'єднався. Готовий до роботи."
# Said once when /meet stop ends the meeting. Set to "" to leave silently.
farewell = "До зустрічі!"
rmsFloor = 0.01                # audio below this RMS is room tone, not speech
minUtteranceMs = 300           # a shorter window is a click, not a question
silenceMs = 900                # silence after speech that closes an utterance
maxUtteranceMs = 15000         # the longest single utterance, in milliseconds
ackCooldownMs = 4000           # at most one spoken acknowledgement per this window
bargeInMs = 400                # sustained speech before the answer is stopped
voiceName = ""                 # Windows system voice; "" picks the default
rate = 0                       # speaking rate, -10..10 (0 is the voice's pace)
maxSpeechChars = 600           # longest answer spoken aloud; the group keeps it all
# A voice task with no answer by now says "workingCue"; 0 stays silent.
workingCueMs = 8000
workingCue = "Ще працюю."
# Spoken questions run in their own session, so a long task cannot block the
# room. false uses the project's pinned session and its context.
freshSession = true
# Which voice: auto (Piper if fetched, else the Windows voice), piper, sapi,
# edge, azure or http. "http" calls an OpenAI-compatible /v1/audio/speech
# endpoint and needs the tts-api-key secret (or TTS_API_KEY in the environment);
# the answer text then leaves the machine.
synthesizer = "auto"
# ttsUrl = 'https://api.openai.com/v1/audio/speech'
# ttsModel = "gpt-4o-mini-tts"
# ttsVoice = "alloy"
# ttsFormat = "wav"             # "wav" or "mp3"
# Azure Speech: native uk-UA voices with their own stress. Needs the
# azure-speech-key secret (or AZURE_SPEECH_KEY in the environment).
# synthesizer = "azure"
# azureRegion = "northeurope"
# azureVoice = "uk-UA-OstapNeural"
# azureVoiceEnglish = "en-US-JennyNeural"  # English words inside a sentence
# azureRate = "-5%"
# Say these words the way a Ukrainian speaker would (used when one voice reads
# both languages). With an English Azure voice, names go to that voice instead.
# [voice.pronunciations]
# SignalConnector = "Сигнал Конектор"
# opencode = "опенкод"

# The meeting's own budgets (optional). Presence is advisory and never a gate.
# The deaf alarm posts once per silence spell; the watchdog closes an admitted
# meeting that stops reporting. telemetryMs must be less than activityWindowMs.
[meeting]
silenceBudgetMs = 5000       # inaudible room audio before one deaf-alarm post
activityWindowMs = 30000     # no telemetry this long closes the meeting as failed
telemetryMs = 5000           # how often the page is read; keep below the window

[outbound]
minIntervalMs = 1500         # minimum spacing between sends
maxPerMinute = 20            # rolling cap

[[projects]]
name = "myproject"
path = 'C:\Sources\myproject'
# session = 'ses_...'          # optional: pin tasks to an existing opencode session
# launch = { kind = "herdr" }  # optional: /use opens a visible Herdr workspace
# launch = { kind = "command", argv = ['opencode', '{path}'] }  # or any command
# meet.allow: who may summon a meeting in this project's group. Each entry is a
# Signal uuid/ACI (or the number); label is a readable name for refusals, and
# revokedAt (ISO-8601) retires an entry. An absent or empty list refuses every
# paste — it never accepts by default. The number works today; a uuid entry is
# honoured when known. providers names the room hosts to accept — there is no
# default, so set it or every paste is refused as a foreign provider.
# meet = { allow = [{ id = "+1000", label = "+1000" }], providers = ["meet.jit.si"] }
# Development only: /meet start creates an unguessable room on createHost and
# shares the link in the group. Keep it false outside development.
# meet = { allow = [{ id = "+1000" }], providers = ["meet.jit.si"], create = true, createHost = "meet.jit.si", roomPrefix = "signalconnector" }
