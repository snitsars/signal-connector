[[entry]]
id = 8
type = "story"
title = "Closing end-to-end suite"
description = "One end-to-end suite across the epic: the paste-to-summary path under fakes, plus a live smoke run the operator triggers."
verify = "The suite fails if any Done-when check regresses — refusals, guest join, one summary, credential wipe, energy gate, deaf alarm, spoken-approval refusal."
covers = ["CAP-1", "CAP-2", "CAP-3", "CAP-4", "CAP-5", "CAP-6", "CAP-8"]
after = [7]
hitl = true
risk = "medium"
notes = ["The live smoke run needs the operator in a room."]
